<title>raul.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --bg: #0a0e16;
    --bg-deep: #050710;
    --panel: #121826;
    --border-dark: #05070c;
    --border-light: #3a4664;
    --border-shadow: #010204;
    --text: #e9edf5;
    --muted: #7c88a3;
    --cyan: #5eead4;
    --cyan-dim: #2a8f80;
    --magenta: #ff6ec7;
    --gold: #ffd166;
    --green: #7ee787;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    padding-block: max(40px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    font-family: 'VT323', 'Courier New', monospace;
    position: relative;
    overflow-x: hidden;
  }

  /* starfield */
  .stars, .stars::before, .stars::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background: transparent;
  }
  .stars::before {
    box-shadow:
      6% 12% 0 var(--text), 14% 78% 0 var(--text), 22% 34% 0 var(--cyan),
      31% 61% 0 var(--text), 38% 9% 0 var(--text), 46% 88% 0 var(--gold),
      53% 22% 0 var(--text), 61% 47% 0 var(--text), 68% 71% 0 var(--cyan),
      76% 15% 0 var(--text), 83% 55% 0 var(--text), 91% 83% 0 var(--text),
      9% 92% 0 var(--text), 96% 38% 0 var(--gold), 18% 55% 0 var(--text),
      44% 41% 0 var(--text), 58% 8% 0 var(--text), 72% 92% 0 var(--text);
    width: 2px; height: 2px;
    animation: twinkle-a 3.2s steps(1) infinite;
  }
  .stars::after {
    box-shadow:
      11% 25% 0 var(--text), 26% 66% 0 var(--text), 34% 48% 0 var(--text),
      42% 82% 0 var(--cyan), 55% 33% 0 var(--text), 63% 18% 0 var(--text),
      71% 58% 0 var(--text), 79% 40% 0 var(--gold), 87% 68% 0 var(--text),
      3% 60% 0 var(--text), 95% 12% 0 var(--text), 49% 95% 0 var(--text);
    width: 2px; height: 2px;
    animation: twinkle-b 2.4s steps(1) infinite;
  }
  @keyframes twinkle-a { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
  @keyframes twinkle-b { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.12) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(420px, 100%);
    background: var(--panel);
    border: 4px solid var(--border-dark);
    box-shadow:
      inset 3px 3px 0 var(--border-light),
      inset -3px -3px 0 var(--border-shadow),
      0 0 0 4px var(--bg-deep);
    clip-path: polygon(
      0 10px, 10px 10px, 10px 0,
      calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px)
    );
    padding: 28px 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: .5px;
    color: var(--muted);
  }
  .statusbar .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--green);
  }
  .dot {
    width: 6px; height: 6px;
    background: var(--green);
    animation: blink 1.1s steps(1) infinite;
    box-shadow: 0 0 0 2px var(--bg-deep);
  }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: .15 } }

  .badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .badge {
    flex: none;
    width: 44px;
    height: 44px;
    background: var(--cyan);
    border: 3px solid var(--border-dark);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.25);
    clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--bg-deep);
  }
  .who .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--muted);
    letter-spacing: 1px;
    margin: 0 0 6px;
  }

  h1 {
    margin: 0;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(18px, 5.5vw, 24px);
    line-height: 1.5;
    letter-spacing: .5px;
    text-wrap: balance;
    color: var(--text);
    text-shadow: 3px 3px 0 var(--magenta);
  }

  .meta {
    font-size: 22px;
    color: var(--cyan);
    letter-spacing: .5px;
  }
  .meta span { color: var(--muted); }

  .rule {
    height: 4px;
    background: repeating-linear-gradient(to right, var(--border-light) 0 6px, transparent 6px 12px);
    opacity: .5;
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    padding: 14px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--cyan);
    background: transparent;
    border: 3px solid var(--cyan);
    box-shadow: inset 0 0 0 3px var(--bg-deep);
    clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
    transition: background .1s steps(1), color .1s steps(1);
  }
  .cta .caret { animation: blink 1s steps(1) infinite; }
  .cta:hover, .cta:focus-visible {
    background: var(--cyan);
    color: var(--bg-deep);
    outline: none;
  }
  .cta:focus-visible { box-shadow: inset 0 0 0 3px var(--bg-deep), 0 0 0 3px var(--gold); }

  .url {
    text-align: center;
    font-size: 18px;
    color: var(--muted);
    word-break: break-all;
  }

  footer {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--border-light);
    letter-spacing: .5px;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .cta .caret, .stars::before, .stars::after { animation: none; opacity: .8; }
  }
</style>

<div class="stars" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<main class="card">
  <div class="statusbar">
    <span>PLAYER 01</span>
    <span class="live"><span class="dot" aria-hidden="true"></span>OPEN TO CONNECT</span>
  </div>

  <div class="badge-row">
    <div class="who">
      <p class="eyebrow">PROFILE CARD</p>
      <h1>RAUL<br>LUCERO</h1>
    </div>
    <div class="badge" aria-hidden="true">in</div>
  </div>

  <p class="meta"><span>&gt;</span> ADOBE · SAN DIEGO, CA</p>

  <div class="rule" aria-hidden="true"></div>

  <a class="cta" href="https://www.linkedin.com/in/raul-lucero/" target="_blank" rel="noopener">
    PRESS START <span class="caret">▍</span>
  </a>
  <p class="url">linkedin.com/in/raul-lucero</p>

  <footer>© 2026 RAUL LUCERO · 1 LIFE REMAINING</footer>
</main>
